[project]
name = "chesspdf"
version = "0.1.0"
description = "Chess book PDF -> replay-verified PGN"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zilin Du" }]
keywords = ["chess", "pgn", "fen", "pdf", "ocr", "puzzles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.0",
    "chess>=1.11.2",
    "google-genai>=1.70.0",
    "numpy>=2.5.2",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.2",
    "python-chess",
    "python-dotenv>=1.2.2",
    "reportlab",
    "svglib",
]

[project.urls]
Homepage = "https://github.com/zilin/chesspdf"
Repository = "https://github.com/zilin/chesspdf"
Issues = "https://github.com/zilin/chesspdf/issues"

[project.scripts]
chesspdf = "chesspdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chesspdf"]

# The repo holds extracted book data (books/) that must NEVER ship —
# personal-use format conversion only, no content redistribution.
[tool.hatch.build.targets.sdist]
only-include = ["chesspdf", "plugin", "README.md", "LICENSE", "pyproject.toml"]
